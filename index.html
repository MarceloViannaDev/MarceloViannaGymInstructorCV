const ICONS = { email: "fas fa-envelope", phone: "fas fa-phone", pin: "fas fa-map-marker-alt" };

function renderContact(c) {
  const parts = c.split(" | ");
  const icons = [ICONS.email, ICONS.phone, ICONS.pin];
  return parts.map((p, i) => `<span><i class="${icons[i] || ICONS.pin}"></i>${p}</span>`).join("");
}

function setLang(l) {
  document.documentElement.lang = l === 'en' ? 'en' : 'pt-BR';
  document.getElementById('btn-pt').classList.toggle('active', l === 'pt');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');

  document.getElementById('role').innerHTML = t[l].role;
  document.getElementById('contact').innerHTML = renderContact(t[l].contact);
  document.getElementById('summaryTitle').innerHTML = t[l].summaryTitle;
  document.getElementById('summary').innerHTML = t[l].summary;
  document.getElementById('expTitle').innerHTML = t[l].expTitle;
  document.getElementById('experience').innerHTML = t[l].experience;
  document.getElementById('skillsTitle').innerHTML = t[l].skillsTitle;
  document.getElementById('skills').innerHTML = t[l].skills.map(s => `<span class="chip">${s}</span>`).join('');
  document.getElementById('eduTitle').innerHTML = t[l].eduTitle;
  document.getElementById('education').innerHTML = t[l].education.map(e =>
    `<div class="entry"><i class="fas fa-graduation-cap entry-marker"></i><div><strong>${e.title}</strong><div class="sub">${e.sub}</div></div></div>`
  ).join('');
  document.getElementById('coursesTitle').innerHTML = t[l].coursesTitle;
  document.getElementById('courses').innerHTML = t[l].courses.map(c =>
    `<div class="entry"><i class="fas fa-certificate entry-marker"></i><div><strong>${c.name}</strong><div class="sub">${c.sub}</div></div></div>`
  ).join('');
  document.getElementById('extraTitle').innerHTML = t[l].extraTitle;
  document.getElementById('extra').innerHTML = t[l].extra;
  document.getElementById('projectTitle').innerHTML = t[l].projectTitle;
  document.getElementById('projects').innerHTML = t[l].projects;
  document.getElementById('langTitle').innerHTML = t[l].langTitle;
  document.getElementById('languages').innerHTML = t[l].languages.map(x =>
    `<div class="lang-item"><span class="name">${x.name}</span><span class="level">${x.level}</span></div>`
  ).join('');
  document.getElementById('footer').innerHTML = '© ' + new Date().getFullYear() + ' Marcelo Vianna Pacheco';
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  const btn = document.getElementById('theme-toggle');
  btn.innerHTML = next === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Escuro';
  try { localStorage.setItem('theme', next); } catch (e) {}
}

// Restaura o tema salvo
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  const dark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.getElementById('theme-toggle').innerHTML = dark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
})();

// Inicializa no idioma português
setLang('pt');
</script>
