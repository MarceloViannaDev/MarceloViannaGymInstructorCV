.contact,.subtitle{color:var(--muted)}
.btn{padding:8px 14px;margin-right:8px;cursor:pointer}
.avatar{width:180px;height:180px;border-radius:50%;overflow:hidden;margin:20px auto}
.avatar img{width:100%;height:100%;object-fit:cover}
